<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Library</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/vecteezy_3d-book-icon-with-transparent-background_9377766_900.png" type="image/x-icon">
</head>
<body>

  <section class="header">
      <h1>Book Library</h1>
      <div class="editLibraryArea">
        <dialog>

          <u>Enter book details:</u>
          <form method="post" id="bookForm">
            <input type="text" id="title" placeholder="Title">
            <input type="text" id="author" placeholder="Author">
            <input type="number" id="pages" placeholder="No. of Pages">
            <div>
              <label for="readStatus">Have you read this?</label>
              <input type="checkbox" id="readStatus">
            </div>
          </form>
          <div id="formButtonContainer">
            <button type="button" form="bookForm" class="button" id="submitBtn">Submit</button>
            <button autofocus class="cancelModal">Cancel</button>
          </div>
        </dialog>
        <button class="showModal">Add Book</button>
      </div>
  </section>

  <section class="libraryArea">
    <!-- populated via JS to add unique ID to each book -->
  </section>

  <script src="script.js"></script>
</body>
</html>
